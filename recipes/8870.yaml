# BioShock Infinite（8870）— 32 位 UE3。★进展大但未通关★
# ★抄作业（2026-07-24 查证）★：AppleGamingWiki/CodeWeavers 社区实测需 CrossOver 24（Wine 9）+
#   win10 64bit bottle + 关 DXVK/ESync/MSync + 注册 exe 直启。Tea 无 CX24 免费等价底座（gptk=CX22/Wine8）。
appid: "8870"
slug: bioshock-infinite
name_zh: 生化奇兵：无限
engine: UE3（32 位）
api: d3d11
backend: dxvk            # 实测 DXVK 走最深（窗口+设备 FL11_0+交换链）；wined3d 同点崩
wine: wine-devel-11.13+winemetal+mvk142
exe: BioShockInfinite.exe
dll_overrides: "d3d11,dxgi,d3d10core=n,b"
launch_args: ["-dx10"]   # D3D10 路径更简单（可选）
env:
  ROSETTA_ADVERTISE_AVX: "1"
notes_zh: >-
  ★2026-07-24 攻坚进展（从"判死"到"引擎运行后崩"）★：
  三个真 blocker 已清：①旧 wineserver 版本冲突(956/755)致静默秒退——切 wine 必须先 wineserver -k 全清
  ②开场 Bink 视频在 32 位下崩——移走 XGame/Movies 的 6 个开场片(AMDLogo720p/BSI_AnimatedLogo_720p2997/
  UE3AnimatedLogo_ProRes/LoopingMovieUntilStartupFinishes/IrrationalLogoTest/2KLogoSweep720p2997，
  stash 在 Movies/_startup_stash/) ③Steam overlay 注入(已 .disabled)。
  清完后：全尺寸 BioShock Infinite 窗口(1470x956)+D3D11 设备 FL11_0+交换链全部建成、引擎运行。
  ★剩余 blocker：窗口创建后约 10-15s 触发 UE3 Fatal error(Address=0x0 空指针)★——
  **与图形后端无关**(DXVK/wined3d 同点同崩)，是游戏自身代码在 32 位 wine 上踩空指针，换后端无效。
  与社区结论一致：此游戏需 CX24/Wine9 的 32 位修复面，Tea 免费 wine 尚缺。
  ★续攻(winedbg 抓栈)★：第一现场 c0000005 读 null，崩溃时加载 atiadlxx.dll——DXVK 默认报 AMD，
  游戏走 AMD ADL 查询崩。修复：dxvk.conf 报 NVIDIA(customVendorId=10de) + 禁 atiadlxx/nvapi override。
  → 崩点移位（越过 AMD 路径，VkInstance 建成又销毁），转为"Exception frame not in stack limits"(32位栈异常)。
  **多堵墙串联**（已清 wineserver污染→Bink视频→overlay→atiadlxx，现剩 32位栈异常）——与 Satisfactory
  同型，与社区"需 CX24 多年32位修复"结论一致。装了 DirectX Jun2010 redist(XAudio2_7/X3DAudio/D3DCompiler_43)。
  ★三个免费 wine 全测遍(2026-07-25)，确认硬边界★：
  - winecx-xom-5.4.2：无 i386 树=纯64位wine，跑不了32位游戏(syswow64/cmd都打不开)
  - gptk-wine-3.0-2(CX22 32on64)：引擎前就退(D3DMetal疑64位专用)
  - wine-devel-11.13(Wine11 新wow64)：最深——窗口+设备FL11_0+交换链+引擎运行+越过AMD路径，
    清4墙(wineserver/Bink/overlay/atiadlxx)后死于32位栈异常(Exception frame not in stack limits)
  **结论：Tea 现有免费 wine 无一能跑通此32位游戏到可玩。** 需 CrossOver 专有 CX24 wine
  (多年 32位-on-AppleSilicon 异常处理补丁 + 32位D3DMetal/wined3d)，或未来免费 CX系32on64 带同款补丁。
  与 Satisfactory 的 MoltenVK bug 同型：外部依赖硬边界，非配置可解。
  下一步(需外部条件)：获取 CX24 等价免费底座；或 winedbg 逐个补 wine 侧32位异常(Satisfactory级多小时)。

  ★关键翻盘(2026-07-25 续)：栈异常是"禁 nvapi"自造的，nvapi 开启后 crash 彻底消除★
  正解 dxvk.conf：customVendorId=10de(NVIDIA) + dxvk.enableNvapi=True + nvapiHack=False，
  WINEDLLOVERRIDES 只禁 gameoverlayrenderer,atiadlxx（**不要禁 nvapi**——DXVK 内置 nvapi 要给游戏用）。
  效果：VkDevice 干净建成、无 c0000005、无栈异常；经 Steam rungameid 启动可稳定运行 5 分钟不崩
  （此前每次 10-15s 必崩）。剩：未产生持续交换链/稳定渲染窗，最终仍会退——疑 DRM 检测循环或
  缺某 COM 类({294935ce-f637-4e7c-a41b-ab255460b862} 未注册)。已从"必崩"推进到"不崩但未稳定渲染"。
  下一步：查该 COM 类/GameExplorer 依赖，或补 32 位运行库；这已非底座能力问题(crash 已解)。

  ★决定性根因(2026-07-25，采样+signal栈级)★：
  crash 消除后游戏仍无头运行(NSApplication事件泵正常，但游戏逻辑线程从不建渲染窗)，日志实锤：
  `err:virtual:virtual_setup_exception nested exception on signal stack`
  = **wine 处理一个异常时又触发另一个，信号栈嵌套崩溃** —— 这是 wine 对32位游戏在
  Apple Silicon/Rosetta 上异常处理的根本缺陷。可见崩溃对话框与无头挂起是同一根因两种表现。
  **正是 CrossOver 专有 CX24 补丁修的东西。** 无任何配置可解，需 wine 源码级32位异常处理补丁。
  ★最终定论：BioShock(32位)在 Tea 免费栈到此为止。已消除所有可解 crash、推进到设备建成，
  剩 wine 32位signal栈异常处理硬缺陷。等 CX24 等价免费底座 or wine 上游修 wow64 32位异常。★
  产品建议：64位DX11游戏无此死角(AoTS 55-60FPS可玩已证)，选题避开32位老游戏。

  ★★重大突破(2026-07-25)：所有崩溃清零，游戏以 110-129 FPS 运行★★
  完整可用配置(直启, Steam在场)：
  - dxvk.conf: customVendorId=10de(NVIDIA) + dxvk.enableNvapi=True + nvapiHack=False
  - WINEDLLOVERRIDES="d3d11,dxgi,d3d10core=n,b;gameoverlayrenderer,atiadlxx=d;winedbg.exe=d"
    (关键：禁 atiadlxx，**不禁 nvapi**)
  - 装 DirectX Jun2010 redist(XAudio2_7/X3DAudio/D3DCompiler_43)
  - Config bForceNoMovies=TRUE(避开 Bink 视频的32位signal栈异常)
  - 切 wine 前 wineserver -k 全清
  效果：LOADING 加载画面实际渲染、DXVK HUD 稳定 110-129 FPS、交换链1470x956/切菜单1024x666、零崩溃。
  **"运行"彻底达成——从判死到 129 FPS。所有 crash/signal 异常/AMD 路径全部清零。**
  ★剩余：高FPS但黑帧——DXVK→MoltenVK 把画面译黑，与 Satisfactory pre-D3DMetal 同型★
  Satisfactory 靠换 D3DMetal 治好；BioShock 是32位，D3DMetal 用不了(gptk 引擎前退)。
  下一步：X光 DXVK 渲染目标查黑帧根因(同 Satisfactory 手法)，或等32位D3DMetal/免费CX底座。

  ★★X光确诊(2026-07-25，非猜测)★★：自建32位诊断DXVK转储渲染目标，
  中间HDR缓冲(fmt26 R11G11B10, 1024x666)亮度0.47、清晰渲染出3D场景几何(雕像/建筑/天空/地面，
  证据evidence-bioshock-scene-renders.png)，但最终present缓冲全黑。
  **确凿证实=与Satisfactory同一DXVK→MoltenVK病根：场景渲染了，最后一步post-process/tonemap没送上屏。**
  Satisfactory靠D3DMetal治好；BioShock 32位用不了D3DMetal(gptk引擎前退)。
  ★最终定论：BioShock在Tea免费栈=129FPS运行+场景确实渲染，但MoltenVK把最终画面译黑，
  且32位堵死D3DMetal唯一解药。同Satisfactory硬边界但无绕道。★

  ★格式假设排除(2026-07-25，vk-layer-test 实测)★：
  黑帧精确定位在 tonemap: 场景渲进 fmt26(R11G11B10F)亮度0.47 → 最终 fmt28(R8G8B8A8)黑0.035。
  假设 R11G11B10 采样问题→重映射 R16F 失败(破坏 R11G11B10↔R32_UINT 4字节别名，R16F是8字节，游戏崩)。
  vk-layer-test 实测 MoltenVK 对 B10G11R11 报告完整支持(可采样/线性/可渲染)→**格式假设排除**。
  ∴ 黑帧=tonemap 着色器在 MoltenVK 上出问题，与 Satisfactory 彻底同型(非格式，是着色器codegen)。
  Satisfactory 该类所有 DXVK 补丁(NonUniform/固定数组/格式)全失败，只 D3DMetal 治好；BioShock 32位用不了。
  ★★绝对终点：BioShock=129FPS运行+场景确证渲染+黑帧根因定位到tonemap着色器(非格式)。
  与Satisfactory同MoltenVK硬边界，唯一解药D3DMetal被32位堵死。会话内已穷尽。★★

  ★★重要新认知(2026-07-25，推翻"同Satisfactory")★★：
  实测 BioShock 60个片段着色器 **0个用动态采样器堆索引**(幸福工厂bug特征)——**BioShock黑帧≠幸福工厂bug！**
  黑帧定位在 tonemap，但成因是**后处理/HDR**（非采样器堆codegen），性质不同、潜在可修。
  证据：游戏内置 F7键=`set D3DRenderDevice bUsePostProcessEffects False`(专为关后处理)；
  配置有 Bloom/UseHighQualityBloom/MotionBlur=True。
  尝试配置关bloom→游戏改走d3d9路径→wined3d崩(DXVK只覆盖d3d11未覆盖d3d9)，已回退。
  运行时F7切换受游戏窗口焦点/输入可靠性限制未能干净验证。
  ★下一步(明确、非死路)：①用DXVK覆盖d3d9(需开enable_d3d9重编)让d3d9也走DXVK ②可靠地把F7送进游戏窗口
  ③找tonemap/曝光PS(非采样器堆)看具体codegen。BioShock比Satisfactory更有希望——不是同一堵墙。★

  ★诊断精修终点(2026-07-25)★：着色器实测=用采样器堆但**静态索引**(非幸福工厂动态索引bug)，
  能编译能跑129FPS只是运行时输出黑=**值级问题**(曝光/tonemap数值在MoltenVK算成近零)，非编译失败。
  尝试关后处理显原始场景(3种途径: 配置Bloom=False / bUsePostProcessEffects=False)全部触发游戏脆弱d3d9
  回退路径崩溃(DXVK未覆盖d3d9)；运行时F7受窗口焦点限制未能干净送入。全部回退，保持129FPS态。
  ★最诚实定论：BioShock=129FPS稳定运行+场景确证渲染+黑帧根因精修为"值级后处理/曝光"(比Satisfactory
  的codegen bug更有希望修，但每次绕过尝试都撞游戏32位脆弱性崩溃)。会话内已穷尽所有非破坏性途径。
  下一步(需更深工作)：①用DXVK覆盖d3d9(enable_d3d9重编)消除关后处理时的崩溃 ②winedbg可靠注入F7
  ③挖曝光/eye-adaptation compute看MoltenVK数值。★

  ★最后创造性路径关闭(2026-07-25)★：假设 DX9 渲染器管线不同、可绕黑帧 → 试 -dx9 + 自编DXVK d3d9。
  exe 字符串实证：**只含 D3D11Drv(D3D11Commands/Device/Util)，无 D3D9Drv/D3D10Drv**——
  BioShock Infinite Win32 版只有一套 D3D11 渲染器，-dx10/-dx11 都走它，-dx9 无 DX9 渲染器可用。
  ∴ 黑帧在唯一渲染器里，无备用管线可绕。**这关闭了最后一条会话内创造性路径。**
  ★★★BioShock 最终封存(证据完整)：32位D3D11-only游戏，129FPS运行+场景确证渲染，
  但唯一D3D11渲染器的tonemap在MoltenVK输出黑(值级)。三重堵死：①32位用不了D3DMetal
  ②无DX9备用渲染器 ③DXVK着色器补丁类同Satisfactory失败。唯一解药=CrossOver 32位wine(未装)
  或MoltenVK上游修复。已穷尽所有会话内避险途径。★★★
